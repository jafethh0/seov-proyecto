<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEOV - Orientación Vocacional</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">SEOV</a>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="display-6">Sistema Experto de Orientación Vocacional</h1>
    <p class="lead">Explora carreras y programas técnicos según tus intereses y habilidades.</p>
    <div id="api-status" class="alert alert-secondary">Comprobando conexión con la API...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    apiFetch("/health/")
      .then(() => {
        const el = document.getElementById("api-status");
        el.className = "alert alert-success";
        el.textContent = "API conectada correctamente.";
      })
      .catch(() => {
        const el = document.getElementById("api-status");
        el.className = "alert alert-danger";
        el.textContent = "No se pudo conectar con la API.";
      });
  </script>
</body>
</html>
