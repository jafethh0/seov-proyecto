<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi orientación - SEOV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-5" style="max-width: 720px;">
    <h1 class="h3 mb-2">Mi orientación vocacional</h1>
    <p class="text-secondary">
      Responde un cuestionario de intereses y habilidades y recibe carreras y programas técnicos
      para explorar. Es una guía: no es un examen ni decide tu futuro.
    </p>
    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="card mb-4">
      <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div id="start-text">Cargando…</div>
        <a class="btn btn-primary" id="start-btn" href="/pages/evaluation.html">Comenzar</a>
      </div>
    </div>

    <h2 class="h5">Mis evaluaciones enviadas</h2>
    <div id="history" class="list-group"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    renderNavbar();
    if (requireLogin()) {
      authFetch("/evaluations/").then((list) => {
        const draft = list.find((e) => e.status === "DRAFT");
        document.getElementById("start-text").textContent = draft
          ? "Tienes una evaluación sin terminar."
          : "Puedes empezar una evaluación nueva cuando quieras.";
        document.getElementById("start-btn").textContent = draft ? "Continuar" : "Comenzar";

        const done = list.filter((e) => e.status === "SUBMITTED");
        document.getElementById("history").innerHTML = done.length
          ? done.map((e) => `
              <a class="list-group-item list-group-item-action d-flex justify-content-between"
                 href="/pages/results.html?id=${e.id}">
                <span>Evaluación del ${esc(formatDate(e.submitted_at))}</span>
                <span class="text-secondary">Ver resultados</span>
              </a>`).join("")
          : '<div class="list-group-item text-secondary">Todavía no has enviado ninguna evaluación.</div>';
      }).catch((err) => {
        document.getElementById("alert").classList.remove("d-none");
        showAlert("alert", formatErrors(err));
      });
    }
  </script>
</body>
</html>
