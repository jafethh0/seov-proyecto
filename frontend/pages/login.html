<!doctype html>
<html lang="es-HN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="../favicon.png" />
    <title>Iniciar sesión — SEOV</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="auth-page">
      <div class="container auth-grid">
        <section class="auth-intro">
          <span class="icon-box"><i data-icon="compass"></i></span>
          <h1>Qué bueno tenerte de vuelta</h1>
          <p>Continuá explorando las opciones que pueden conectar contigo.</p>
        </section>
        <form id="login-form" class="form-card" novalidate>
          <div id="form-alert" class="alert" hidden></div>
          <div>
            <label class="form-label" for="email">Correo electrónico</label
            ><input
              class="form-control"
              id="email"
              name="email"
              type="email"
              placeholder="nombre@correo.com"
              required
            />
          </div>
          <div>
            <label class="form-label" for="password">Contraseña</label
            ><input class="form-control" id="password" name="password" type="password" required />
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar →</button>
          <p class="form-switch">
            ¿Todavía no tienes cuenta? <a href="register.html">Regístrate</a>
          </p>
        </form>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/login.js"></script>
  </body>
</html>
