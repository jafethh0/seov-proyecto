<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - SEOV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-4">Iniciar sesión</h1>
    <div id="alert" class="alert d-none" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-control" id="email" type="email" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" id="submit-btn" type="submit">Entrar</button>
    </form>
    <p class="mt-3 text-center">¿No tienes cuenta? <a href="/pages/register.html">Regístrate</a></p>
    <p class="text-muted small text-center">Si el servidor estuvo inactivo, la primera vez puede tardar cerca de un minuto.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    renderNavbar();
    if (Auth.isLoggedIn()) window.location.href = "/pages/profile.html";

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      try {
        const tokens = await apiFetch("/auth/login/", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        Auth.save(tokens);
        window.location.href = "/pages/profile.html";
      } catch (err) {
        const message = err && err.status === 401
          ? "Correo o contraseña incorrectos."
          : err && err.status === 429
            ? "Demasiados intentos. Espera un minuto e inténtalo de nuevo."
            : formatErrors(err);
        document.getElementById("alert").classList.remove("d-none");
        showAlert("alert", message);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
