<!doctype html>
<html lang="es-HN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="../favicon.png" />
    <title>Mi perfil — SEOV</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="page-shell">
      <div class="container" style="max-width: 760px">
        <a class="back-link" href="dashboard.html">← Volver a Mi orientación</a>
        <header class="page-title">
          <span class="section-kicker">TU CUENTA</span>
          <h1>Mi perfil</h1>
          <p>Mantén tus datos al día para mostrarte opciones cerca de donde quieres estudiar.</p>
        </header>
        <div id="form-alert" class="alert" hidden></div>
        <form id="profile-form" class="form-card">
          <div>
            <label class="form-label" for="email">Correo electrónico</label
            ><input class="form-control" id="email" type="email" readonly />
          </div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="first-name">Nombre</label
              ><input class="form-control" id="first-name" name="first_name" required />
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="last-name">Apellido</label
              ><input class="form-control" id="last-name" name="last_name" required />
            </div>
          </div>
          <div>
            <label class="form-label" for="education-level">Situación</label
            ><select class="form-select" id="education-level" name="education_level">
              <option value="HIGH_SCHOOL">Estudio secundaria / bachillerato</option>
              <option value="UNIVERSITY">Quiero cambiar de carrera</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="department">Departamento donde quiero estudiar</label
            ><select class="form-select" id="department" name="preferred_department"></select>
          </div>
          <div class="text-end">
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
          </div>
        </form>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/profile.js"></script>
  </body>
</html>
