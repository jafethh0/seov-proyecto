<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil - SEOV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-5" style="max-width: 560px;">
    <h1 class="h3 mb-4">Mi perfil</h1>
    <div id="alert" class="alert d-none" role="alert"></div>

    <form id="profile-form" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" id="email" disabled>
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="first_name">Nombre</label>
          <input class="form-control" id="first_name" maxlength="150">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="last_name">Apellido</label>
          <input class="form-control" id="last_name" maxlength="150">
        </div>
        <div class="col-12">
          <label class="form-label" for="education_level">Situación</label>
          <select class="form-select" id="education_level">
            <option value="HIGH_SCHOOL">Estudio secundaria / bachillerato</option>
            <option value="UNIVERSITY">Soy universitario y quiero cambiar de carrera</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="preferred_department">Departamento donde quiero estudiar</label>
          <select class="form-select" id="preferred_department"></select>
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-4" id="submit-btn" type="submit">Guardar cambios</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    renderNavbar();
    if (!Auth.isLoggedIn()) window.location.href = "/pages/login.html";

    async function loadProfile() {
      await loadDepartments("preferred_department");
      const profile = await authFetch("/profile/");
      document.getElementById("email").value = profile.email;
      document.getElementById("first_name").value = profile.first_name;
      document.getElementById("last_name").value = profile.last_name;
      document.getElementById("education_level").value = profile.education_level;
      document.getElementById("preferred_department").value = profile.preferred_department || "";
    }

    loadProfile().catch((err) => {
      document.getElementById("alert").classList.remove("d-none");
      showAlert("alert", formatErrors(err));
    });

    document.getElementById("profile-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      const department = document.getElementById("preferred_department").value;
      try {
        await authFetch("/profile/", {
          method: "PATCH",
          body: JSON.stringify({
            first_name: document.getElementById("first_name").value.trim(),
            last_name: document.getElementById("last_name").value.trim(),
            education_level: document.getElementById("education_level").value,
            preferred_department: department ? Number(department) : null,
          }),
        });
        document.getElementById("alert").classList.remove("d-none");
        showAlert("alert", "Cambios guardados.", "success");
      } catch (err) {
        document.getElementById("alert").classList.remove("d-none");
        showAlert("alert", formatErrors(err));
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
