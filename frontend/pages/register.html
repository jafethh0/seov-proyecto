<!doctype html>
<html lang="es-HN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="../favicon.png" />
    <title>Registro — SEOV</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="auth-page">
      <div class="container auth-grid">
        <section class="auth-intro">
          <span class="icon-box coral"><i data-icon="sparkles"></i></span>
          <h1>Empecemos por conocerte</h1>
          <p>Crea tu cuenta para guardar tu avance y consultar tus resultados cuando quieras.</p>
        </section>
        <form id="register-form" class="form-card" novalidate>
          <div id="form-alert" class="alert" hidden></div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="first-name">Nombre</label
              ><input class="form-control" id="first-name" name="first_name" required />
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="last-name">Apellido</label
              ><input class="form-control" id="last-name" name="last_name" required />
            </div>
          </div>
          <div>
            <label class="form-label" for="email">Correo electrónico</label
            ><input
              class="form-control"
              id="email"
              name="email"
              type="email"
              placeholder="nombre@correo.com"
              required
            />
          </div>
          <div>
            <label class="form-label" for="password">Contraseña</label
            ><input
              class="form-control"
              id="password"
              name="password"
              type="password"
              minlength="8"
              placeholder="Mínimo 8 caracteres"
              required
            />
          </div>
          <div>
            <label class="form-label" for="education-level">¿Cuál es tu situación?</label
            ><select class="form-select" id="education-level" name="education_level" required>
              <option value="">Selecciona una opción</option>
              <option value="HIGH_SCHOOL">Estudio secundaria / bachillerato</option>
              <option value="UNIVERSITY">
                Soy universitario y quiero cambiar de carrera
              </option>
            </select>
          </div>
          <div>
            <label class="form-label" for="department"
              >Departamento donde quieres estudiar (opcional)</label
            ><select class="form-select" id="department" name="preferred_department"></select>
          </div>
          <button class="btn btn-primary w-100" type="submit">Crear mi cuenta →</button>
          <p class="form-switch">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
          </p>
        </form>
      </div>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/register.js"></script>
  </body>
</html>
