<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - SEOV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-5" style="max-width: 560px;">
    <h1 class="h3 mb-4">Crear cuenta</h1>
    <div id="alert" class="alert d-none" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="row g-3">
        <div class="col-sm-6">
          <label class="form-label" for="first_name">Nombre</label>
          <input class="form-control" id="first_name" required maxlength="150" autocomplete="given-name">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="last_name">Apellido</label>
          <input class="form-control" id="last_name" maxlength="150" autocomplete="family-name">
        </div>
        <div class="col-12">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" id="email" type="email" required autocomplete="email">
        </div>
        <div class="col-12">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" id="password" type="password" required minlength="8" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres; evita contraseñas comunes o solo números.</div>
        </div>
        <div class="col-12">
          <label class="form-label" for="education_level">¿Cuál es tu situación?</label>
          <select class="form-select" id="education_level" required>
            <option value="HIGH_SCHOOL">Estudio secundaria / bachillerato</option>
            <option value="UNIVERSITY">Soy universitario y quiero cambiar de carrera</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="preferred_department">¿En qué departamento quieres estudiar?</label>
          <select class="form-select" id="preferred_department"></select>
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-4" id="submit-btn" type="submit">Registrarme</button>
    </form>
    <p class="mt-3 text-center">¿Ya tienes cuenta? <a href="/pages/login.html">Inicia sesión</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    renderNavbar();
    loadDepartments("preferred_department").catch(() => {});

    document.getElementById("register-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      const department = document.getElementById("preferred_department").value;
      const payload = {
        first_name: document.getElementById("first_name").value.trim(),
        last_name: document.getElementById("last_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        education_level: document.getElementById("education_level").value,
        preferred_department: department ? Number(department) : null,
      };
      try {
        await apiFetch("/auth/register/", { method: "POST", body: JSON.stringify(payload) });
        // Tras registrarse, se inicia sesión automáticamente.
        const tokens = await apiFetch("/auth/login/", {
          method: "POST",
          body: JSON.stringify({ email: payload.email, password: payload.password }),
        });
        Auth.save(tokens);
        window.location.href = "/pages/profile.html";
      } catch (err) {
        const alertBox = document.getElementById("alert");
        alertBox.classList.remove("d-none");
        showAlert("alert", formatErrors(err));
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
