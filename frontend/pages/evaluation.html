<!doctype html>
<html lang="es-HN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="../favicon.png" />
    <title>Cuestionario — SEOV</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="eval-page">
      <header class="eval-progress-header">
        <div class="container eval-header-grid">
          <div>
            <span class="section-kicker" id="section-kicker">INTERESES</span>
            <div class="small fw-bold" id="page-label">Cargando…</div>
          </div>
          <div>
            <small class="d-block text-center mb-1" id="answer-count">0 de 0 respondidas</small>
            <div
              class="progress"
              role="progressbar"
              aria-label="Progreso del cuestionario"
              aria-valuenow="0"
              aria-valuemin="0"
              aria-valuemax="100"
              id="progress"
            >
              <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
          </div>
          <span class="saving-state" id="saving-state" aria-live="polite"></span>
        </div>
      </header>
      <div class="question-container">
        <div id="form-alert" class="alert mt-3" role="alert" hidden></div>
        <section class="question-intro">
          <span class="section-kicker" id="intro-kicker">INTERESES</span>
          <h1 id="section-title">¿Qué tanto te gustaría?</h1>
          <p id="section-instructions"></p>
        </section>
        <div id="questions"></div>
        <div class="alert alert-light d-flex gap-2 mt-4">
          <i data-icon="info"></i
          ><small
            >Tus respuestas se guardan automáticamente. Puedes dejar preguntas sin responder,
            pero necesitamos suficientes respuestas en cada tema para calcular tu resultado.</small
          >
        </div>
      </div>
    </main>
    <nav class="eval-actions">
      <div class="question-container eval-actions-inner">
        <button class="btn btn-outline-primary" id="prev-btn" type="button">Anterior</button
        ><span class="small text-secondary" id="page-label-bottom"></span
        ><button class="btn btn-primary" id="next-btn" type="button">Siguiente →</button>
      </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/evaluation.js"></script>
  </body>
</html>
